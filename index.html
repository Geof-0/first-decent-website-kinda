<!DOCTYPE html>
<head>
    <meta chatset="UTF-8">
    <title>dashboard</title>

    <!-- link other files -->
    <link rel="stylesheet" href="style.css">

    <script src="listeners.js" defer></script>
    <script src="elements.js" defer></script>
    <script src="main.js" defer></script>
    <script src="loops.js" defer></script>

</head>
<body id="body">
    <div id="add-menu">
        <div id="add-menu-title" class="parent-hover">
            Add Elements
        </div>
        <div id="add-note" class="add-element parent-hover">
            <img src="images/notepad.png" class="add-element-img">
            Add Notepad
        </div>
        <div id="add-spreadsheet" class="add-element parent-hover">
            <img src="images/spreadsheet.png" class="add-element-img">
            Add Spreadsheet
        </div>
    </div>

    <div id="add-complex-menu">
        <div id="add-complex-title" class="parent-hover">
            Add Interactives
        </div>
        <!-- where complex/ interactive elements spawners should go -->
        <div id="add-display" class="add-element parent-hover">
            <img src="images/terminal.png" class="add-element-img">
            Add Display
        </div>
    </div>






    <!-- cloneable objects -->

    <!-- notepad prefab -->
    <div id="notepad-prefab" class="notepad" hidden>
            <div class="notepad-title" contenteditable=true>Type Here</div>
            <div class="notepad-text" contenteditable=true>Type Here</div>
            <img class="element-settings parent-hover" src="images/those-3-dots.png">
            <div class="element-settings-view">
                <div class="delete-element parent-hover-instant">
                    <img src="images/red-trashcan.png" class="element-settings-view-img">
                    Delete
                </div>
            </div>
    </div>

    <!-- spreadsheet prefab -->
    <div id="spreadsheet-prefab" class="parent-grab spreadsheet" hidden>
        <div class="spreadsheet-title" contenteditable="true">more of a list but im too lazy at this point</div>
        <div class="spreadsheet-spreadsheet"></div>

        <img class="element-settings parent-hover" src="images/those-3-dots.png">
        <div class="element-settings-view">
            <div class="delete-element parent-hover-instant">
                <img src="images/red-trashcan.png" class="element-settings-view-img">
                Delete
            </div>
            <div class="add-cell parent-hover-instant">
                <img src="images/plus-sign.png" class="element-settings-view-img">
                Add Cell
            </div>
        </div>

        <!-- sub-prefabs -->
        <div id="spreadsheet-cell-prefab" class="spreadsheet-spreadsheet-cell" contenteditable="true" hidden></div>
    </div>

    




    <!-- coding stuff (this will be VERY annoying) -->
    <div id="display-prefab" class="parent-grab display" hidden>
        <div class="display-display"></div>
        <div class="connector display-connector"><img class="connector-img"></div>


        <!-- settings -->
        <img class="element-settings parent-hover" src="images/those-3-dots.png">
        <div class="element-settings-view">
            <div class="delete-element parent-hover-instant">
                <img src="images/red-trashcan.png" class="element-settings-view-img">
                Delete
            </div>
            <div class="add-log parent-hover-instant">
                <img src="images/plus-sign.png" class="element-settings-view-img">    
                Add Log   
            </div>
        </div>
    </div>



    <!-- support lines -->
    <svg>
    </svg>
</body>
